<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Cicatriz Sonora — estúdio de memórias audiovisuais. Transformamos histórias em som, imagem e presença." />
  <title>Cicatriz Sonora — Memórias que encontram uma forma de continuar vivas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="top">
    <section id="hero" class="hero">
      <nav class="hero__nav">
        <span class="hero__nav-mark serif">CICATRIZ&nbsp;SONORA</span>
        <div class="hero__nav-links">
          <a href="#o-que-e">O que é</a>
          <a href="#como-funciona">Como funciona</a>
          <a href="#conversar">Conversar</a>
        </div>
      </nav>

      <div class="hero__stage">
        <h1 id="wordmark" class="hero__mark serif">CICATRIZ SONORA</h1>
        <p class="hero__tagline">Memórias que encontram uma forma de continuar vivas.</p>
        <button id="playHero" class="hero__play" type="button" aria-label="Assistir à peça">
          <span class="hero__play-icon">▶</span> assistir à peça
        </button>
      </div>
    </section>

    <div id="film" class="film" hidden>
      <button class="film__close" type="button" aria-label="Fechar">✕</button>
      <div class="film__frame">
        <!-- src é preenchido pelo JS a partir do CONFIG.VIMEO_ID -->
        <iframe id="filmFrame" title="Cicatriz Sonora — a peça"
          allow="autoplay; fullscreen; picture-in-picture"
          allowfullscreen></iframe>
      </div>
      <div class="film__after">
        <p class="film__after-line serif">E aí, a sua história?</p>
        <a class="film__after-cta" href="#conversar">me conta a sua história</a>
      </div>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
